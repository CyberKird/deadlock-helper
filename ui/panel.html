<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' dlh:; img-src dlh:; style-src 'self' dlh:; style-src-attr 'unsafe-inline'; script-src 'self' dlh:">
  <title>Deadlock Helper</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="panel">
    <header id="bar">
      <span class="mark"></span>
      <span class="title">Deadlock Helper</span>
      <span id="status" class="pill"></span>
      <span class="grow"></span>
      <button id="btn-update" class="text-btn" hidden></button>
      <button id="btn-report" class="icon-btn small" data-hint="Raporteaza o problema">!</button>
      <button id="btn-collapse" class="icon-btn" data-hint="Strange panoul (CTRL+ALT+D)">&#8211;</button>
      <button id="btn-close" class="icon-btn" data-hint="Inchide">&#215;</button>
    </header>
    <main id="body"></main>
  </div>
  <div id="picker" hidden></div>
  <div id="tip" hidden></div>
  <script src="panel.js"></script>
</body>
</html>
