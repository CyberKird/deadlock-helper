<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Deadlock Helper</title>
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="report.css">
</head>
<body>
  <div id="panel" class="report">
    <header id="bar">
      <span class="mark"></span>
      <span class="title" data-t="report_title"></span>
      <span class="grow"></span>
      <button id="close" class="icon-btn">&#215;</button>
    </header>
    <form id="form">
      <label for="desc" data-t="report_what"></label>
      <textarea id="desc" rows="6" maxlength="2000" spellcheck="false"></textarea>
      <label for="email" data-t="report_email"></label>
      <input id="email" type="email" maxlength="200" spellcheck="false" autocomplete="email">
      <label class="check"><input id="include" type="checkbox" checked> <span data-t="report_include"></span></label>
      <pre id="diag"></pre>
      <p id="result" role="status"></p>
      <div class="actions">
        <button id="mail" type="button" class="link" data-t="report_mail" hidden></button>
        <button id="send" type="submit" class="primary" data-t="report_send"></button>
      </div>
    </form>
  </div>
  <script src="i18n.js"></script>
  <script src="report.js"></script>
</body>
</html>
